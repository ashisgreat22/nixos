<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ash (Phil) B. | Python Developer & Data Engineer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #0ea5e9;
            --accent-hover: #38bdf8;
            --card-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        main {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1.5rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 2rem;
        }

        @media (min-width: 600px) {
            .hero {
                flex-direction: row;
                text-align: left;
            }
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            box-shadow: 8px 8px 0px 0px rgba(14, 165, 233, 0.3);
        }

        .hero-text h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        .hero-text p {
            font-size: 1.25rem;
            color: #cbd5e1;
        }

        .services {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 600px) {
            .services {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .service-card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-left: 4px solid var(--accent-color);
            transition: transform 0.2s ease;
        }

        .service-card:hover {
            transform: translateY(-5px);
        }

        .service-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        @media (min-width: 600px) {
            .cta-container {
                flex-direction: row;
                justify-content: center;
            }
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            color: var(--bg-color);
            background-color: var(--accent-color);
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 4px 4px 0px 0px var(--text-color);
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px var(--text-color);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            box-shadow: 4px 4px 0px 0px var(--accent-color);
        }

        .btn-outline:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>
    <main>
        <header class="hero">
            <img src="profile.png" alt="Ash B." class="profile-img">
            <div class="hero-text">
                <h1>Ash (Phil) B. | Python Developer & Data Engineer</h1>
                <p>I build custom Python scripts that replace hours of manual data entry.</p>
            </div>
        </header>

        <section>
            <div class="services">
                <div class="service-card">
                    <h3>Web Scraping & Data Extraction</h3>
                </div>
                <div class="service-card">
                    <h3>Workflow & Excel Automation</h3>
                </div>
                <div class="service-card">
                    <h3>Discord / Telegram Chatbots</h3>
                </div>
            </div>
        </section>

        <section class="cta-container">
            <a href="https://www.fiverr.com/ashie10" target="_blank" rel="noopener noreferrer" class="btn">Hire me on Fiverr</a>
            <a href="https://github.com/ashisgreat22" target="_blank" rel="noopener noreferrer" class="btn btn-outline">View my GitHub</a>
            <a href="mailto:dev@ashisgreat.xyz" class="btn btn-outline">Contact via Email</a>
        </section>
    </main>
</body>
</html>
